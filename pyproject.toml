[project]
name = "slm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ajdsouz", email = "aj.anthonydsouza@gmail.com" }
]
requires-python = ">=3.12.12"
dependencies = [
    "torch>=2.15.0 ; sys_platform == 'darwin'",
    "torch>=2.15.0 ; sys_platform == 'win32'",
    "torch>=2.15.0 ; sys_platform == 'linux'",
    "lightning>=2.6.6",
]

[project.scripts]
slm = "slm:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "beartype>=0.23.1",
    "jaxtyping>=0.3.11",
    "pytest>=9.2.0",
    "ty>=0.0.104",
]

[tool.pytest.ini_options]
addopts = "--jaxtyping-packages=slm,beartype.beartype"
